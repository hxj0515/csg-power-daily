<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>三国塔防·烽火连城</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- ============ 主菜单 ============ -->
    <section id="screen-menu" class="screen">
      <div class="menu-wrap">
        <h1 class="game-title">三国塔防</h1>
        <div class="game-sub">· 烽火连城 ·</div>
        <p class="menu-tag">建名将之塔，御百万雄兵。消遣一时，征战三国。</p>
        <div class="menu-btns">
          <button id="btn-start" class="btn btn-primary">开始游戏</button>
          <button id="btn-import" class="btn">导入存档</button>
          <button id="btn-about" class="btn">关于</button>
        </div>
        <input id="file-import" type="file" accept="application/json" hidden />
      </div>
    </section>

    <!-- ============ 将军档案 ============ -->
    <section id="screen-profiles" class="screen" hidden>
      <div class="panel">
        <h2 class="panel-title">选择将军档案</h2>
        <div id="profile-list" class="profile-list"></div>
        <div class="create-row">
          <input id="profile-name" class="inp" maxlength="16" placeholder="输入新将军名号…" />
          <button id="btn-create" class="btn btn-primary">新建档案</button>
        </div>
        <button id="btn-back-menu" class="btn btn-link">‹ 返回主菜单</button>
      </div>
    </section>

    <!-- ============ 战役地图 ============ -->
    <section id="screen-maps" class="screen" hidden>
      <div class="panel">
        <h2 class="panel-title">选择战役</h2>
        <div id="map-list" class="map-list"></div>
        <button id="btn-back-profiles" class="btn btn-link">‹ 返回档案</button>
      </div>
    </section>

    <!-- ============ 对局 ============ -->
    <section id="screen-game" class="screen" hidden>
      <div class="game-head">
        <div id="game-title" class="game-head-title"></div>
        <div class="hud">
          <span id="hud-gold" class="hud-item">💰 0</span>
          <span id="hud-lives" class="hud-item">🏰 0</span>
          <span id="hud-wave" class="hud-item">⚔️ 波次 0</span>
          <span id="hud-score" class="hud-item">⭐ 0</span>
        </div>
        <div class="head-btns">
          <button id="btn-wave" class="btn btn-go">出战 ▶</button>
          <button id="btn-speed" class="btn">1×</button>
          <button id="btn-pause" class="btn">暂停</button>
          <button id="btn-quit" class="btn btn-link">退出</button>
        </div>
      </div>

      <div class="stage">
        <canvas id="game-canvas" width="920" height="552"></canvas>

        <!-- 选中塔面板 -->
        <div id="tower-panel" class="tower-panel" hidden>
          <div id="tp-name" class="tp-name"></div>
          <div id="tp-info" class="tp-info"></div>
          <div class="tp-btns">
            <button id="btn-upgrade" class="btn btn-primary">升级</button>
            <button id="btn-sell" class="btn btn-danger">出售</button>
          </div>
        </div>
      </div>

      <div class="dock">
        <div class="dock-col">
          <div class="dock-label">建造防御塔</div>
          <div id="tower-palette" class="tower-palette"></div>
        </div>
        <div class="dock-col">
          <div class="dock-label">主动技能</div>
          <div id="skill-bar" class="skill-bar"></div>
        </div>
      </div>
    </section>

    <!-- ============ 胜负弹层 ============ -->
    <div id="overlay-msg" class="overlay" hidden>
      <div class="overlay-card">
        <div id="om-title" class="om-title"></div>
        <div id="om-body" class="om-body"></div>
        <div class="overlay-btns">
          <button id="btn-next" class="btn btn-primary">下一关 ▶</button>
          <button id="btn-retry" class="btn">重试</button>
          <button id="btn-tomaps" class="btn btn-link">返回地图</button>
        </div>
      </div>
    </div>

    <!-- ============ 关于弹层 ============ -->
    <div id="overlay-about" class="overlay" hidden>
      <div class="overlay-card">
        <div class="om-title">三国塔防 · 烽火连城</div>
        <div class="om-body" style="text-align:left;line-height:1.7">
          纯静态网页塔防，数据存于本机浏览器。<br>
          · 选将军建个人档案，进度自动保存；换设备请用「导出存档」备份 JSON。<br>
          · 建塔消耗金币，击杀敌军获利；敌人抵达城池扣耐久，归零即败。<br>
          · 4 系防御塔（弓弩/火攻/陷阵营/谋士）各 3 级；2 个主动技能（火烧赤壁/八阵图）。<br>
          · 3 场战役：长坂坡 / 赤壁 / 官渡，通关解锁下一关，按剩余城池评 1–3 星。
        </div>
        <div class="overlay-btns"><button class="btn btn-primary" onclick="this.parentNode.parentNode.parentNode.hidden=true">知道了</button></div>
      </div>
    </div>

  </div>

  <script src="config.js"></script>
  <script src="save.js"></script>
  <script src="engine.js"></script>
  <script src="ui.js"></script>
</body>
</html>
