/* ---------- 工具函数 ---------- */
function todayBeijingDateStr(){
  return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'long',day:'numeric'}).format(new Date());
}
function isTodayBeijing(dateStr){ return dateStr === todayBeijingDateStr(); }
function fmtISODate(iso){
  if(!iso) return '-';
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(iso);
  if(!m) return iso;
  return `${m[1]}年${parseInt(m[2],10)}月${parseInt(m[3],10)}日`;
}

/* ---------- 联网探测（不阻塞渲染） ---------- */
async function probeInternet(){
  const dot=document.getElementById('statusDot'), txt=document.getElementById('statusText');
  try{
    const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),6000);
    await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent('https://www.csg.cn/xwzx/'),{signal:ctrl.signal});
    clearTimeout(t); dot.style.background='var(--accent)'; txt.textContent='在线（已连接互联网）'; return true;
  }catch(e){
    dot.style.background='var(--warn)'; txt.textContent='离线（使用内置最新数据）'; return false;
  }
}

/* ---------- 数据加载：远程优先，回退内置 ---------- */
async function loadReport(){
  try{
    const res=await fetch(DATA_URL,{cache:'no-store'});
    if(res.ok){
      const data=await res.json();
      if(data&&Array.isArray(data.sections)&&data.sections.length) return {data,live:true};
    }
  }catch(e){ /* 本地 file:// 或托管不可达时回退内置 */ }
  return {data:EMBEDDED_REPORT,live:false};
}

/* ---------- 过滤状态 ---------- */
const state={ domain:null, q:"" };

/* ---------- 渲染 ---------- */
function render(report, live){
  let global=0; const flat=[];
  report.sections.forEach(sec=>{
    sec.items.forEach(it=>{ global++; flat.push({...it,sectionId:sec.id,g:global}); });
  });

  document.getElementById('heroDate').textContent = `报告日期：${fmtISODate(report.date)}（北京时间）`;

  const total=flat.length;
  const counts=report.sections.map(s=>({id:s.id,name:s.name,icon:s.icon,n:s.items.length}));
  let html=`<div class="stat"><div class="num">${total}</div><div class="lbl">总条数</div></div>`;
  counts.forEach(c=>{ html+=`<div class="stat stat-link" data-sec="${c.id}" title="点击跳转到「${c.name}」板块"><div class="num">${c.n}</div><div class="lbl">${c.icon} ${c.name}</div></div>`; });
  document.getElementById('heroStats').innerHTML=html;
  document.querySelectorAll('#heroStats .stat-link').forEach(el=>{
    el.addEventListener('click',()=>scrollToSec(el.getAttribute('data-sec')));
  });
  // 锚点导航（动态生成，含全部版块，自动同步招投标等新增版块）
  document.getElementById('navLinks').innerHTML =
    report.sections.map(s=>`<a href="#sec-${s.id}">${s.icon} ${s.name}</a>`).join('');

  // 领域统计（Hero 下方以筛选条呈现，这里仅计算）
  const domCounts={}; DOMAINS.forEach(d=>domCounts[d.key]=0);
  flat.forEach(f=>{ if(domCounts[f.domain]!==undefined) domCounts[f.domain]++; });

  const banner=document.getElementById('banner'); const reportDateStr=fmtISODate(report.date);
  if(isTodayBeijing(reportDateStr)){
    banner.className='banner ok'; banner.style.display='flex';
    banner.innerHTML=`✅ 今日（${todayBeijingDateStr()}）数据已生成，共 ${total} 条 · 仅含电能质量/电力电子/智能电网/低压智能台区/配电网/服务类/物资工具类/应急工具类 8 大领域 · 数据${live?'实时获取':'内置聚合'}。`;
  }else{
    banner.className='banner fallback'; banner.style.display='flex';
    banner.innerHTML=`⚠️ 今日数据尚未生成，已回退展示最近一期（${reportDateStr}），共 ${total} 条。`;
  }

  // 正文
  const main=document.getElementById('main'); let body='';
  report.sections.forEach(sec=>{
    body+=`<section class="section" id="sec-${sec.id}"><div class="section-head"><h2>${sec.icon} ${sec.name}</h2><span class="count">${sec.items.length} 条</span></div><div class="grid">`;
    flat.filter(f=>f.sectionId===sec.id).forEach(f=>{
      const dc=DOMAIN_COLOR[f.domain]||'#9fb0d0';
      body+=`<article class="card" data-text="${(f.title+' '+f.summary).replace(/"/g,'')}" data-domain="${escapeAttr(f.domain)}">
        <span class="idx">#${f.g}</span>
        <div class="title">${escapeHtml(f.title)}</div>
        <div class="meta">
          <span class="chip dom" style="background:${dc}">${escapeHtml(f.domain)}</span>
          <span class="chip src">${escapeHtml(f.source)}</span>
          <span class="chip">🕒 ${escapeHtml(f.date)}</span>
        </div>
        <div class="summary">${escapeHtml(f.summary)}</div>
        <a class="link" href="${escapeAttr(f.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
      </article>`;
    });
    body+=`</div></section>`;
  });
  main.innerHTML=body;

  // 领域筛选条
  const bar=document.getElementById('domainBar');
  let barHtml=`<span class="dpill ${state.domain===null?'active':''}" data-dom="__all" style="${state.domain===null?'background:var(--accent)':''}">全部</span>`;
  DOMAINS.forEach(d=>{
    const active=state.domain===d.key;
    barHtml+=`<span class="dpill ${active?'active':''}" data-dom="${escapeAttr(d.key)}" style="${active?`background:${d.color}`:''}"><span class="swatch" style="background:${d.color}"></span>${d.key} <b>${domCounts[d.key]}</b></span>`;
  });
  bar.innerHTML=barHtml;
  bar.querySelectorAll('.dpill').forEach(p=>{
    p.addEventListener('click',()=>{
      const v=p.getAttribute('data-dom'); state.domain=(v==='__all')?null:v; render(report,live);
    });
  });

  // 页脚
  const srcs=[...new Set(flat.map(f=>f.source))];
  document.getElementById('foot').innerHTML=
    `南方电网电力资讯日报 · 领域聚焦版<br>`+
    `本页共 <b>${total}</b> 条资讯，按六固定版块分组、全局连续编号，并仅保留 `+
    `<b>电能质量 / 电力电子 / 智能电网 / 低压智能台区 / 配电网 / 服务类 / 物资工具类 / 应急工具类</b> 八大领域。`+
    `<br>数据源：${srcs.join('、')} 等公开报道（经联网检索聚合）。时间均为北京时间通俗格式。<br>`+
    `<span style="opacity:.7">报告日期 ${fmtISODate(report.date)||'-'} · 数据${live?'实时获取':'内置聚合最新一期'}</span>`;

  applyFilters();
}

function scrollToSec(id){
  const el=document.getElementById('sec-'+id);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function applyFilters(){
  const q=state.q.trim().toLowerCase();
  let visible=0;
  document.querySelectorAll('.card').forEach(card=>{
    const hitQ = !q || (card.dataset.text||'').toLowerCase().includes(q);
    const hitD = !state.domain || card.dataset.domain===state.domain;
    const show = hitQ && hitD;
    card.classList.toggle('hide', !show);
    if(show) visible++;
  });
  document.getElementById('empty').style.display = visible ? 'none' : 'block';
}

/* ---------- 启动 ---------- */
(async function init(){
  const {data,live}=await loadReport();
  render(data,live);
  probeInternet();
  document.getElementById('search').addEventListener('input',e=>{ state.q=e.target.value; applyFilters(); });
  document.getElementById('refreshBtn').addEventListener('click',async()=>{
    const {data:d,live:l}=await loadReport(); render(d,l); await probeInternet(); window.scrollTo({top:0,behavior:'smooth'});
  });
})();
</script>
</body>
</html>
